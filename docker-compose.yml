version: '3.8'

services:
  postgres:
    image: postgres:14
    container_name: url-shortener-postgres
    restart: always
    environment:
      POSTGRES_USER: maxim
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: urlshortener
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: